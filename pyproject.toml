[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lubanagent"
version = "0.1.0"
description = "开源 Agent 工程基座：LangChain/LangGraph 之上的完整起步底座"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "langchain-core>=1.5",
    "langchain-openai>=1.4",
    "langgraph>=1.2.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "anyio>=4.3",
    "typer>=0.12",
    "pyyaml>=6.0",
    # MCP 客户端/服务端：1.x 已验证；2.x 改名 streamablehttp_client → 未验证不升级（H14）
    "mcp>=1.9,<2",
]

[project.scripts]
luban = "lubanagent.cli.main:app"

[project.optional-dependencies]
mysql = ["asyncmy>=0.2.9", "pymysql>=1.1"]
langfuse = ["langfuse>=2.50"]
langsmith = ["langsmith>=0.1"]
docs = ["pypdf>=6.19", "python-docx>=1.1"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "import-linter>=2.0",
    "types-pyyaml>=6.0",
    "pypdf>=6.19",
    "python-docx>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["lubanagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
# 中文为主的基座：全角标点规则（RUF001/002/003）对中文文档串/注释/字符串是噪音，全局忽略
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.coverage.run]
source = ["lubanagent"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
