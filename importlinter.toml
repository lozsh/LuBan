# import-linter 契约：领地隔离与依赖方向的 CI 守卫（架构设计 §3.2）
# 运行：lint-imports --config importlinter.toml
[tool.importlinter]
root_packages = ["lubanagent", "app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "领地隔离：lubanagent → app 禁止（框架只能经 Registry 拿用户扩展）"
type = "forbidden"
source_modules = ["lubanagent"]
forbidden_modules = ["app"]

[[tool.importlinter.contracts]]
name = "商业边界：lubanagent → lubanagent_channels 禁止（渠道层单向依赖核心）"
type = "forbidden"
source_modules = ["lubanagent"]
forbidden_modules = ["lubanagent_channels"]

[[tool.importlinter.contracts]]
name = "lubanagent/app → demos 禁止（示例不反向进入运行态）"
type = "forbidden"
source_modules = ["lubanagent", "app"]
forbidden_modules = ["demos"]

[[tool.importlinter.contracts]]
name = "分层：core 是最底层（不依赖任何兄弟包与重依赖）"
type = "forbidden"
source_modules = ["lubanagent.core"]
forbidden_modules = [
    "lubanagent.extension", "lubanagent.config", "lubanagent.persistence",
    "lubanagent.model", "lubanagent.runtime", "lubanagent.tool", "lubanagent.mcp",
    "lubanagent.skill", "lubanagent.knowledge", "lubanagent.memory",
    "lubanagent.graph", "lubanagent.multiagent", "lubanagent.observability",
    "lubanagent.api", "lubanagent.app", "lubanagent.cli",
    "sqlalchemy", "fastapi", "langchain", "langchain_core", "httpx",
]

[[tool.importlinter.contracts]]
name = "分层：extension 只依赖 core（不依赖上层与重依赖）"
type = "forbidden"
source_modules = ["lubanagent.extension"]
forbidden_modules = [
    "lubanagent.config", "lubanagent.persistence", "lubanagent.model",
    "lubanagent.runtime", "lubanagent.tool", "lubanagent.mcp",
    "lubanagent.skill", "lubanagent.knowledge", "lubanagent.memory",
    "lubanagent.graph", "lubanagent.multiagent", "lubanagent.observability",
    "lubanagent.api", "lubanagent.app", "lubanagent.cli",
    "sqlalchemy", "fastapi", "langchain", "langchain_core",
]

[[tool.importlinter.contracts]]
name = "分层：config 只依赖 core（不依赖上层与重依赖）"
type = "forbidden"
source_modules = ["lubanagent.config"]
forbidden_modules = [
    "lubanagent.extension", "lubanagent.persistence", "lubanagent.model",
    "lubanagent.runtime", "lubanagent.tool", "lubanagent.mcp",
    "lubanagent.skill", "lubanagent.knowledge", "lubanagent.memory",
    "lubanagent.graph", "lubanagent.multiagent", "lubanagent.observability",
    "lubanagent.api", "lubanagent.app", "lubanagent.cli",
    "sqlalchemy", "fastapi", "langchain", "langchain_core",
]

[[tool.importlinter.contracts]]
name = "分层：persistence 不依赖上层模块与 Web 框架"
type = "forbidden"
source_modules = ["lubanagent.persistence"]
forbidden_modules = [
    "lubanagent.extension", "lubanagent.model", "lubanagent.runtime",
